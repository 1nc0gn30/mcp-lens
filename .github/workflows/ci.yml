name: MCP Lens CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: python3 -m pip install --no-cache-dir pytest

      - name: Run MCP Lens test suite
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPATH: "src"
        run: |
          python3 -m pytest -v
          python3 ./bin/mcp-lens --version
          python3 ./bin/mcp-lens test
          python3 ./bin/mcp-lens --json
          python3 ./bin/mcp-lens-tui --json

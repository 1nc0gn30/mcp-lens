    <text x="0" y="36" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="800" letter-spacing="0.4">MCP LENS</text>
    <text x="0" y="60" fill="#CBD5E1" font-family="system-ui, -apple-system, sans-serif" font-size="13.5">Zero-dependency real-time stdio/SSE traffic sniffer, BPE token auditor, schema minifier &amp; stdio MCP server.</text>
  </g>


    <text x="18" y="54" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Hardened Loopback Enclave</text>
    <text x="18" y="76" fill="#94A3B8" font-family="ui-monospace, monospace" font-size="10.5">Strict Host/Origin 403 • CSP • 0 CDN</text>


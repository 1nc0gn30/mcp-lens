    <text x="390" y="76" fill="#94A3B8" font-family="ui-monospace, monospace" font-size="10.5">SSE Waterfall • /api/replay • 100% Stdlib</text>

    <rect x="744" y="0" width="352" height="98" rx="12" fill="#101320" stroke="#10B981" stroke-opacity="0.42"/>
